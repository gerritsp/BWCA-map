name: Validate static site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Install pinned JavaScript dependencies
        run: npm ci
      - name: Sync locally hosted browser libraries
        run: npm run vendor
      - name: Build static site
        run: python APP.py
      - name: Run Python integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate lake bundles
        run: python Scripts/validate_lake_bundles.py
      - name: Run JavaScript tests
        run: npm test
      - name: Audit JavaScript production dependencies
        run: npm run audit:prod
      - name: Install Python audit tool
        run: python -m pip install pip-audit
      - name: Audit pinned Python dependencies
        run: python -m pip_audit -r requirements-lock.txt
      - name: Reject whitespace errors
        run: git diff --check
