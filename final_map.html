<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BWCA Site Finder</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    />

    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView([48.1, -91.6], 9);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);

L.marker([48.1, -91.6])
    .addTo(map)
    .bindPopup("Hello from the BWCA!");

</script>

</body>
</html>
