<style>
:root{--ink:#193b35;--muted:#61736b;--paper:#f7f8f2;--line:#dbe3d8;--accent:#256653}*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:var(--ink);background:var(--paper)}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.18em;font-size:19px}.brand small{display:block;font-size:10px;letter-spacing:.12em;font-weight:500;margin-top:4px;color:var(--muted)}a{color:var(--accent)}header a{padding:11px 18px;border:1px solid var(--line);border-radius:30px;text-decoration:none;font-weight:600}.workspace{display:grid;grid-template-columns:320px minmax(0,1fr);height:calc(100dvh - 72px)}aside{padding:24px;overflow:auto;border-right:1px solid var(--line)}.eyebrow{text-transform:uppercase;font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:700}h1{font-family:Georgia,serif;font-size:31px;font-weight:400;line-height:1.15;margin:10px 0}p{color:var(--muted);line-height:1.65}.modes{display:flex;gap:5px;padding:4px;border:1px solid var(--line);border-radius:12px;margin:20px 0}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:10px;background:white;color:var(--ink)}button:focus-visible,a:focus-visible{outline:3px solid #c8862a;outline-offset:3px}.modes button{flex:1;border:0;background:transparent}.modes button[aria-pressed=true]{background:var(--accent);color:white}#map{min-width:0;height:100%;background:#dce9e4}#lake-details{border-top:1px solid var(--line);margin-top:24px;padding-top:20px;overflow-wrap:anywhere}#lake-details h2{font:26px Georgia,serif;margin:10px 0}#lake-content{line-height:1.65}#lake-content details{padding:10px 0;border-top:1px solid var(--line)}#lake-content summary{cursor:pointer;font-weight:600}#lake-content a{display:inline-block;max-width:100%}.detail-heading{display:flex;justify-content:space-between;align-items:center}.legend{background:#fffffff2;padding:12px;border-radius:12px;box-shadow:0 3px 16px #193b3515;font-size:12px;line-height:1.6;max-width:240px}.leaflet-tooltip{pointer-events:none!important;border:0;border-radius:6px;font:12px system-ui;box-shadow:0 2px 10px #193b3520}.leaflet-control-zoom{border:0!important;box-shadow:0 3px 16px #193b3525!important}.leaflet-interactive{cursor:pointer}#route-controls .legend{box-shadow:none;padding:0;background:none;max-width:none}#route-status-text{display:block;color:var(--muted);margin-top:8px}#route-controls[hidden]{display:none}#lake-content table{max-width:100%;font-size:12px}#lake-content pre{white-space:pre-wrap} @media(max-width:700px){header{height:62px;padding:0 16px}.workspace{height:calc(100dvh - 62px);grid-template-columns:1fr;grid-template-rows:minmax(220px,60%) minmax(150px,40%)}#map{grid-row:1}aside{grid-row:2;padding:16px;border-right:0;border-top:1px solid var(--line)}aside h1{font-size:24px}aside>p{margin:5px 0}.modes{margin:12px 0}#lake-details{margin-top:12px;padding-top:12px}.leaflet-bottom.leaflet-right .legend{max-height:110px;overflow:auto}}
</style></head><body>
<header><div class="brand">BWCA<small>BOUNDARY WATERS · TRIP EXPLORER</small></div><a href="lake_search.html">Find a lake ↗</a></header>
